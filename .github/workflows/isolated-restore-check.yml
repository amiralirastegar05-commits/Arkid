name: Isolated encrypted backup restore check

# Only a deliberate push with this subject on this fixed branch may execute.
# Never run on pull requests or on a schedule. This does not connect to the
# hosted project and must only run after explicit owner permission.
on:
  push:
    branches:
      - arena/947a456b-arkid

permissions:
  actions: read

jobs:
  isolated-restore:
    if: startsWith(github.event.head_commit.message, 'Run isolated restore check [approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check restore passphrase is present
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.ARKID_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test "${#BACKUP_PASSPHRASE}" -ge 24 || { echo 'Restore passphrase is missing or too short.'; exit 1; }
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1
      - name: Download only the encrypted backup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arkid-encrypted-db-backup
          path: ${{ runner.temp }}/arkid-encrypted-restore-input
          github-token: ${{ github.token }}
          run-id: 44724874628
      - name: Restore into disposable local Postgres and check schema
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.ARKID_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/arkid-restore.XXXXXXXX")"
          cleanup() {
            if [ -f "$scratch/local/supabase/config.toml" ]; then
              supabase stop --no-backup --workdir "$scratch/local" >/dev/null 2>&1 || true
            fi
            rm -rf "$scratch" "$RUNNER_TEMP/arkid-encrypted-restore-input"
          }
          trap cleanup EXIT
          test -f "$RUNNER_TEMP/arkid-encrypted-restore-input/arkid-backup.tar.gz.gpg"
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt "$RUNNER_TEMP/arkid-encrypted-restore-input/arkid-backup.tar.gz.gpg" >"$scratch/backup.tar.gz" 3<<<"$BACKUP_PASSPHRASE" || { echo '::error title=Restore check::Decryption failed.'; exit 1; }
          echo '::notice title=Restore phase::Backup decrypted.'
          # Only fixed plain files are extracted; paths and links in archives
          # are never trusted. Their contents are never printed or uploaded.
          python3 - "$scratch" <<'PY'
          import pathlib, sys, tarfile
          root = pathlib.Path(sys.argv[1])
          expected = {'roles.sql', 'schema.sql', 'data.sql'}
          with tarfile.open(root / 'backup.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              assert len(members) == 3 and {m.name for m in members} == expected
              assert all(m.isfile() for m in members)
              for member in members:
                  with archive.extractfile(member) as source, (root / member.name).open('wb') as target:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
          PY
          echo '::notice title=Restore phase::Archive extracted.'
          mkdir -p "$scratch/local"
          # A fresh unlinked CLI workdir ensures every target below is local.
          supabase init --workdir "$scratch/local" >/dev/null || { echo '::error title=Restore check::Local initialization failed.'; exit 1; }
          echo '::notice title=Restore phase::Local configuration initialized.'
          supabase db start --workdir "$scratch/local" >/dev/null || { echo '::error title=Restore check::Local Postgres startup failed.'; exit 1; }
          echo '::notice title=Restore phase::Local Postgres started.'
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres
          command -v psql >/dev/null || { echo '::error title=Restore check::Postgres client unavailable on runner.'; exit 1; }
          # SQL and errors can contain private data; keep all output local and
          # only publish a generic outcome. ON_ERROR_STOP rolls back failures.
          if ! psql --single-transaction --set ON_ERROR_STOP=1 --file "$scratch/roles.sql" --file "$scratch/schema.sql" --command 'SET session_replication_role = replica' --file "$scratch/data.sql" >"$scratch/restore.log" 2>&1; then
            if grep -qi 'permission denied' "$scratch/restore.log"; then category='permission denied';
            elif grep -qi 'already exists' "$scratch/restore.log"; then category='object conflict';
            elif grep -qi 'does not exist' "$scratch/restore.log"; then category='missing object or version mismatch';
            else category='other SQL or connection error'; fi
            echo "::warning title=Restore check::Standard-role restore failed: $category. Private SQL output was not logged."
            # Report only a fixed file category and allowlisted infrastructure
            # diagnostics, never SQL text, user data, identifiers or passwords.
            python3 - "$scratch/restore.log" <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          match = re.search(r'psql:[^\r\n]*/(roles|schema|data)\.sql:\d+:', s)
          if match:
              print('::notice title=Restore file::' + match.group(1))
          known = {
              'permission denied to grant role "postgres"': 'managed postgres role grant',
              'must be able to SET ROLE "supabase_admin"': 'managed owner role',
              'permission denied to set parameter "session_replication_role"': 'replication role setting',
              'permission denied for table buckets_vectors': 'managed vector storage table',
              'permission denied for table vector_indexes': 'managed vector storage index table',
          }
          for pattern, label in known.items():
              if pattern in s:
                  print('::notice title=Restore diagnosis::' + label)
                  break
          PY
            # An additional, strictly local superuser trial helps distinguish
            # an unreadable dump from limitations of the target postgres role.
            # It does NOT prove this backup can be restored to hosted Supabase.
            test "$category" = 'permission denied' || exit 1
            export PGUSER=supabase_admin
            local_admin="$(psql --set ON_ERROR_STOP=1 --tuples-only --no-align --command 'select rolsuper from pg_roles where rolname=current_user' 2>"$scratch/admin.log")" || { echo '::error title=Restore check::Local admin login failed.'; exit 1; }
            test "$local_admin" = t || { echo '::error title=Restore check::Local admin is not a superuser.'; exit 1; }
            if ! psql --single-transaction --set ON_ERROR_STOP=1 --file "$scratch/roles.sql" --file "$scratch/schema.sql" --command 'SET session_replication_role = replica' --file "$scratch/data.sql" >"$scratch/admin-restore.log" 2>&1; then
              python3 - "$scratch/admin-restore.log" <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          match = re.search(r'psql:[^\r\n]*/(roles|schema|data)\.sql:\d+:', s)
          if match: print('::notice title=Admin restore file::' + match.group(1))
          categories = [('permission denied','permission denied'),('already exists','object conflict'),('does not exist','missing object or version mismatch'),('syntax error','SQL syntax error'),('invalid configuration parameter','unsupported configuration'),('unrecognized configuration parameter','unsupported configuration'),('cannot be dropped','role or object in use')]
          for pattern, label in categories:
              if pattern in s.lower():
                  print('::notice title=Admin restore category::' + label)
                  break
          else: print('::notice title=Admin restore category::other restore error')
          PY
              echo '::error title=Restore check::Local superuser restore also failed; private output was not logged.'
              exit 1
            fi
            echo '::warning title=Restore check::Restore required a local superuser; hosted recovery is not verified.'
          fi
          echo '::notice title=Restore phase::SQL restore transaction succeeded.'
          result="$(psql --set ON_ERROR_STOP=1 --tuples-only --no-align --command "select count(*) = 3 and bool_and(c.relrowsecurity) and bool_and(has_table_privilege('authenticated', c.oid, 'SELECT')) and has_function_privilege('authenticated','public.arkid_save_snapshot(uuid,uuid,jsonb)','EXECUTE') from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('profiles','arkid_cloud_snapshots','arkid_cloud_snapshot_history') and c.relkind='r'" 2>"$scratch/check.log")"
          test "$result" = t || { echo '::error title=Restore check::Expected restored tables, RLS or authenticated grants were not found.'; exit 1; }
          echo '::notice title=Restore phase::Three restored tables have RLS and authenticated read grants; snapshot RPC execute grant exists.'
          echo 'Other services, actual content and a full production recovery remain unverified.'
