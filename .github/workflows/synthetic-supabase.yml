name: Synthetic local Supabase integration

# No repository secrets and no hosted Supabase projects. The local stack is
# isolated inside a disposable GitHub-hosted runner with synthetic users only.
on:
  push:
    branches:
      - arena/947a456b-arkid

permissions:
  contents: read

jobs:
  local-integration:
    if: startsWith(github.event.head_commit.message, 'Run local Supabase test [approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1
      - name: Start isolated local stack and run integration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/arkid-synthetic.XXXXXXXX")"
          cleanup() {
            if [ -f "$scratch/supabase/config.toml" ]; then
              supabase stop --no-backup --workdir "$scratch" >/dev/null 2>&1 || true
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          supabase init --workdir "$scratch" >/dev/null
          echo '::notice title=Synthetic test::Local configuration initialized.'
          supabase start --workdir "$scratch" --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor >/dev/null || { echo '::error title=Synthetic test::Local services failed to start.'; exit 1; }
          echo '::notice title=Synthetic test::Local services started.'
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres
          for migration in supabase/new-project/migrations/0*.sql; do
            if ! psql --set ON_ERROR_STOP=1 --single-transaction --file "$migration" >"$scratch/migration.log" 2>&1; then
              printf '::error title=Synthetic migration::%s failed.\n' "$(basename "$migration")"
              grep -m1 -E 'ERROR:|FATAL:' "$scratch/migration.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic diagnostic::/' || true
              exit 1
            fi
          done
          psql --set ON_ERROR_STOP=1 --command "notify pgrst, 'reload schema'" >/dev/null
          echo '::notice title=Synthetic test::Migrations installed on local database.'
          # Status contains ONLY local generated development keys. Never print it.
          supabase status --workdir "$scratch" -o env >"$scratch/status.env"
          set -a; source "$scratch/status.env"; set +a
          export ARKID_LOCAL_SUPABASE=yes ARKID_LOCAL_API=http://127.0.0.1:54321 ARKID_LOCAL_ANON="$ANON_KEY" ARKID_LOCAL_SERVICE="$SERVICE_ROLE_KEY"
          if ! node tests/supabase/local-real-stack.mjs >"$scratch/test.log" 2>&1; then
            echo '::error title=Synthetic test::Local Auth, REST or Worker integration failed.'
            head -6 "$scratch/test.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic diagnostic::/' || true
            exit 1
          fi
          echo '::notice title=Synthetic test::Synthetic local Auth, REST, PostgreSQL and Worker flows passed.'
          # Rehearse backup/restore separately, using ONLY this synthetic DB.
          # Never use a linked/remote flag or any real project credential.
          psql --tuples-only --no-align --command "select (select count(*) from auth.users), (select count(*) from public.profiles), (select count(*) from public.arkid_cloud_snapshots)" >"$scratch/before.count"
          supabase db dump --workdir "$scratch" --local --role-only --file "$scratch/roles.sql" >/dev/null
          supabase db dump --workdir "$scratch" --local --file "$scratch/schema.sql" >/dev/null
          supabase db dump --workdir "$scratch" --local --data-only --use-copy --exclude storage.buckets_vectors --exclude storage.vector_indexes --file "$scratch/data.sql" >/dev/null
          echo '::notice title=Synthetic restore::Local synthetic dumps created.'
          # This destroys only the synthetic local stack, not a hosted project.
          supabase stop --workdir "$scratch" --no-backup >/dev/null 2>&1
          supabase db start --workdir "$scratch" >/dev/null
          if ! psql --single-transaction --set ON_ERROR_STOP=1 --file "$scratch/roles.sql" --file "$scratch/schema.sql" --command 'SET session_replication_role = replica' --file "$scratch/data.sql" >"$scratch/restore.log" 2>&1; then
            echo '::error title=Synthetic restore::Standard-role restore failed.'
            grep -m1 'ERROR:' "$scratch/restore.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic restore diagnostic::/' || true
            exit 1
          fi
          psql --tuples-only --no-align --command "select (select count(*) from auth.users), (select count(*) from public.profiles), (select count(*) from public.arkid_cloud_snapshots)" >"$scratch/after.count"
          cmp -s "$scratch/before.count" "$scratch/after.count" || { echo '::error title=Synthetic restore::Synthetic row counts differ.'; exit 1; }
          # The auth.users signup trigger is part of the recovery requirements.
          trigger="$(psql --tuples-only --no-align --command "select exists(select 1 from pg_trigger where tgrelid='auth.users'::regclass and tgname='arkid_create_profile' and not tgisinternal)")"
          test "$trigger" = t || { echo '::error title=Synthetic restore::Profile creation trigger was not recovered.'; exit 1; }
          echo '::notice title=Synthetic restore::Synthetic restore, counts and profile trigger passed.'
