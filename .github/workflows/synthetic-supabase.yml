name: Synthetic local Supabase integration

# No repository secrets and no hosted Supabase projects. The local stack is
# isolated inside a disposable GitHub-hosted runner with synthetic users only.
on:
  push:
    branches:
      - arena/947a456b-arkid

permissions:
  contents: read

jobs:
  local-integration:
    if: startsWith(github.event.head_commit.message, 'Run local Supabase test [approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1
      - name: Start isolated local stack and run integration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/arkid-synthetic.XXXXXXXX")"
          cleanup() {
            if [ -f "$scratch/supabase/config.toml" ]; then
              supabase stop --no-backup --workdir "$scratch" >/dev/null 2>&1 || true
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          supabase init --workdir "$scratch" >/dev/null
          echo '::notice title=Synthetic test::Local configuration initialized.'
          supabase start --workdir "$scratch" --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor >/dev/null || { echo '::error title=Synthetic test::Local services failed to start.'; exit 1; }
          echo '::notice title=Synthetic test::Local services started.'
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres
          # A fresh local DB needs 001/002; the existing hosted project does not.
          for migration in supabase/new-project/migrations/001_profiles.sql supabase/new-project/migrations/002_snapshots.sql; do
            if ! psql --set ON_ERROR_STOP=1 --single-transaction --file "$migration" >"$scratch/migration.log" 2>&1; then
              printf '::error title=Synthetic migration::%s failed.\n' "$(basename "$migration")"
              grep -m1 -E 'ERROR:|FATAL:' "$scratch/migration.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic diagnostic::/' || true
              exit 1
            fi
          done
          # Verify CLI migration rollback and history in the disposable DB.
          # Its URL is fixed localhost, never a hosted project.
          mkdir -p "$scratch/supabase/migrations"
          probe="$scratch/supabase/migrations/20260101000000_atomic_probe.sql"
          printf '%s\n' 'create table public.arkid_rollback_probe(id int); select 1/0;' >"$probe"
          if supabase db push --workdir "$scratch" --db-url 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --skip-vault --yes >"$scratch/probe.log" 2>&1; then
            echo '::error title=Synthetic migration::Invalid migration unexpectedly succeeded.'; exit 1
          fi
          absent="$(psql --tuples-only --no-align --command "select to_regclass('public.arkid_rollback_probe') is null")"
          test "$absent" = t || { echo '::error title=Synthetic migration::CLI migration was not atomic.'; exit 1; }
          rm "$probe"
          node supabase/new-project/build-social-stage.mjs >"$scratch/supabase/migrations/20261120120000_arkid_social_stage_1.sql"
          if ! supabase db push --workdir "$scratch" --db-url 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --skip-vault --yes >"$scratch/migration.log" 2>&1; then
            echo '::error title=Synthetic migration::Atomic social stage failed.'
            grep -m1 -E 'ERROR:|FATAL:|error' "$scratch/migration.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic diagnostic::/' || true
            exit 1
          fi
          recorded="$(psql --tuples-only --no-align --command "select count(*) from supabase_migrations.schema_migrations where version='20261120120000'")"
          test "$recorded" = 1 || { echo '::error title=Synthetic migration::Migration history missing.'; exit 1; }
          echo '::notice title=Synthetic test::CLI rollback and migration history verified locally.'
          held="$(psql --tuples-only --no-align --command "select not has_function_privilege('authenticated','public.arkid_report_profile(uuid,text)','execute') and not has_function_privilege('authenticated','public.arkid_report_team(uuid,uuid,text)','execute')")"
          test "$held" = t || { echo '::error title=Synthetic migration::Reporting hold was not applied.'; exit 1; }
          echo '::notice title=Synthetic test::Atomic social stage and reporting hold installed locally.'
          # Temporarily enable reporting only in this disposable stack so the
          # full moderation path can be tested. The script reapplies the hold.
          psql --set ON_ERROR_STOP=1 --command 'grant execute on function public.arkid_report_profile(uuid,text),public.arkid_report_team(uuid,uuid,text) to authenticated' >/dev/null
          psql --set ON_ERROR_STOP=1 --command "notify pgrst, 'reload schema'" >/dev/null
          echo '::notice title=Synthetic test::Migrations installed on local database.'
          # Status contains ONLY local generated development keys. Never print it.
          supabase status --workdir "$scratch" -o env >"$scratch/status.env"
          set -a; source "$scratch/status.env"; set +a
          export ARKID_LOCAL_SUPABASE=yes ARKID_LOCAL_API=http://127.0.0.1:54321 ARKID_LOCAL_ANON="$ANON_KEY" ARKID_LOCAL_SERVICE="$SERVICE_ROLE_KEY"
          if ! node tests/supabase/local-real-stack.mjs >"$scratch/test.log" 2>&1; then
            echo '::error title=Synthetic test::Local Auth, REST or Worker integration failed.'
            head -6 "$scratch/test.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic diagnostic::/' || true
            exit 1
          fi
          echo '::notice title=Synthetic test::Synthetic local Auth, REST, PostgreSQL and Worker flows passed.'
          # Rehearse backup/restore separately, using ONLY this synthetic DB.
          # Never use a linked/remote flag or any real project credential.
          psql --tuples-only --no-align --command "select (select count(*) from auth.users), (select count(*) from public.profiles), (select count(*) from public.arkid_cloud_snapshots)" >"$scratch/before.count"
          # The default CLI schema dump excludes managed auth schema objects,
          # including the application's trigger on auth.users. Preserve the
          # known definition separately for this synthetic recovery rehearsal.
          trigger="$(psql --tuples-only --no-align --command "select count(*) from pg_trigger t join pg_proc p on p.oid=t.tgfoid join pg_namespace n on n.oid=p.pronamespace where t.tgrelid='auth.users'::regclass and t.tgname='arkid_create_profile' and not t.tgisinternal and n.nspname='public' and p.proname='arkid_create_profile'")"
          test "$trigger" = 1 || { echo '::error title=Synthetic restore::Expected source trigger missing.'; exit 1; }
          printf '%s\n' 'CREATE TRIGGER arkid_create_profile AFTER INSERT ON auth.users FOR EACH ROW EXECUTE FUNCTION public.arkid_create_profile();' >"$scratch/trigger.sql"
          supabase db dump --workdir "$scratch" --local --role-only --file "$scratch/roles.sql" >/dev/null
          supabase db dump --workdir "$scratch" --local --file "$scratch/schema.sql" >/dev/null
          supabase db dump --workdir "$scratch" --local --data-only --use-copy --exclude storage.buckets_vectors --exclude storage.vector_indexes --file "$scratch/data.sql" >/dev/null
          echo '::notice title=Synthetic restore::Local synthetic dumps created.'
          # Do not automatically replay the migration into the empty restore
          # target: the dump supplies the schema. This scratch file is disposable.
          rm "$scratch/supabase/migrations/20261120120000_arkid_social_stage_1.sql"
          # This destroys only the synthetic local stack, not a hosted project.
          supabase stop --workdir "$scratch" --no-backup >/dev/null 2>&1
          supabase db start --workdir "$scratch" >/dev/null
          if ! psql --single-transaction --set ON_ERROR_STOP=1 --file "$scratch/roles.sql" --file "$scratch/schema.sql" --file "$scratch/trigger.sql" --command 'SET session_replication_role = replica' --file "$scratch/data.sql" >"$scratch/restore.log" 2>&1; then
            echo '::warning title=Synthetic restore::Standard-role restore failed; testing a local-only admin fallback.'
            grep -m1 'ERROR:' "$scratch/restore.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic restore diagnostic::/' || true
            export PGUSER=supabase_admin
            admin="$(psql --tuples-only --no-align --command 'select rolsuper from pg_roles where rolname=current_user')"
            test "$admin" = t || { echo '::error title=Synthetic restore::No local superuser.'; exit 1; }
            if ! psql --single-transaction --set ON_ERROR_STOP=1 --file "$scratch/roles.sql" --file "$scratch/schema.sql" --file "$scratch/trigger.sql" --command 'SET session_replication_role = replica' --file "$scratch/data.sql" >"$scratch/restore-admin.log" 2>&1; then
              echo '::error title=Synthetic restore::Local admin restore failed.'
              grep -m1 'ERROR:' "$scratch/restore-admin.log" | cut -c1-300 | sed 's/^/::notice title=Synthetic restore diagnostic::/' || true
              exit 1
            fi
            echo '::warning title=Synthetic restore::Local superuser required; hosted recovery remains unverified.'
          fi
          psql --tuples-only --no-align --command "select (select count(*) from auth.users), (select count(*) from public.profiles), (select count(*) from public.arkid_cloud_snapshots)" >"$scratch/after.count"
          cmp -s "$scratch/before.count" "$scratch/after.count" || { echo '::error title=Synthetic restore::Synthetic row counts differ.'; exit 1; }
          secure="$(psql --tuples-only --no-align --command "select count(*) = 3 and bool_and(c.relrowsecurity) and bool_and(has_table_privilege('authenticated', c.oid, 'SELECT')) and has_function_privilege('authenticated','public.arkid_save_snapshot(uuid,uuid,jsonb)','EXECUTE') from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('profiles','arkid_cloud_snapshots','arkid_cloud_snapshot_history') and c.relkind='r'")"
          test "$secure" = t || { echo '::error title=Synthetic restore::Expected RLS or grants missing.'; exit 1; }
          # The auth.users signup trigger is part of the recovery requirements.
          trigger="$(psql --tuples-only --no-align --command "select exists(select 1 from pg_trigger where tgrelid='auth.users'::regclass and tgname='arkid_create_profile' and not tgisinternal)")"
          test "$trigger" = t || { echo '::error title=Synthetic restore::Profile creation trigger was not recovered.'; exit 1; }
          new_user="$(psql --quiet --tuples-only --no-align --command "insert into auth.users(id,raw_user_meta_data) values (gen_random_uuid(),'{\"name\":\"Synthetic after restore\"}') returning id")"
          profile="$(psql --tuples-only --no-align --command "select exists(select 1 from public.profiles where id='$new_user'::uuid and display_name='Synthetic after restore')")"
          test "$profile" = t || { echo '::error title=Synthetic restore::Restored signup trigger did not create a profile.'; exit 1; }
          echo '::notice title=Synthetic restore::Synthetic restore, counts and reconstructed signup trigger passed.'
