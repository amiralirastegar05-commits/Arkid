<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<meta name="description" content="مجموعه بازی‌های کلاسیک آرکید — طراحی و توسعه: AliGraph">
<title>آرکید کلاسیک | Classic Arcade</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root {
  --bg-deep: #060810; --bg: #0a0d12;
  --panel: rgba(255,255,255,.04); --panel-hover: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.1); --border-hover: rgba(245,197,24,.5);
  --text: #e8eef5; --text-dim: #8894a6;
  --gold: #f5c518;
  --radius: 16px; --radius-lg: 20px;
  --shadow-lg: 0 20px 50px rgba(0,0,0,.5);
  --shadow-glow: 0 0 40px rgba(245,197,24,.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
html { background: var(--bg-deep); }
body {
  font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(245,197,24,.06), transparent 60%),
    radial-gradient(ellipse 70% 40% at 50% 100%, rgba(96,165,250,.05), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(96,165,250,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(96,165,250,.025) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: .04;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px;
  background: rgba(10,13,18,.78);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.logo-icon {
  width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--gold), #ff8a5c);
  color: #1a1500;
  box-shadow: 0 4px 14px rgba(245,197,24,.3);
}
.logo-text { font-size: 15px; font-weight: 900; letter-spacing: .22em; }
.header-spacer { flex: 1 1 auto; }
.header-btn {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text-dim);
  display: grid; place-items: center;
  cursor: pointer; text-decoration: none;
  transition: all .18s;
}
.header-btn:hover {
  color: var(--gold);
  border-color: var(--border-hover);
  background: var(--panel-hover);
  transform: translateY(-1px);
}
.header-btn.spinning svg { animation: spin .8s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.hero {
  padding: 56px 20px 40px;
  max-width: 1200px; margin: 0 auto;
  text-align: center; position: relative; z-index: 1;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px;
  border: 1px solid rgba(245,197,24,.3);
  background: rgba(245,197,24,.08);
  color: var(--gold);
  font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
  margin-bottom: 18px;
}
.hero-title {
  font-size: clamp(32px, 6vw, 56px); font-weight: 900;
  line-height: 1.15; margin-bottom: 14px;
  background: linear-gradient(135deg, #fff 30%, var(--gold) 60%, #ff8a5c 90%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  letter-spacing: -.02em;
}
.hero-sub {
  font-size: clamp(13px, 2vw, 16px);
  color: var(--text-dim); max-width: 560px;
  margin: 0 auto 28px; line-height: 1.7;
}
.hero-stats {
  display: inline-flex; gap: 28px;
  padding: 16px 26px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--border);
}
.stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stat b { font-size: 24px; font-weight: 900; color: var(--gold); line-height: 1; }
.stat span { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }
.recent {
  max-width: 1200px; margin: 0 auto 28px; padding: 0 20px;
  position: relative; z-index: 1;
}
.recent h2 {
  font-size: 12px; font-weight: 800;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 12px;
}
.recent-list {
  display: flex; gap: 10px; overflow-x: auto;
  padding-bottom: 8px; scrollbar-width: thin;
}
.recent-list::-webkit-scrollbar { height: 6px; }
.recent-list::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.15); border-radius: 3px;
}
.recent-card {
  flex: 0 0 auto; display: flex; gap: 10px; align-items: center;
  padding: 8px 14px 8px 8px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--border);
  cursor: pointer; text-decoration: none; color: inherit;
  transition: all .16s; min-width: 170px;
}
.recent-card:hover { border-color: var(--border-hover); background: var(--panel-hover); }
.recent-card-cover {
  width: 44px; height: 44px; border-radius: 8px;
  overflow: hidden; flex: 0 0 44px; background: #000;
}
.recent-card-cover svg { width: 100%; height: 100%; }
.recent-card-body { display: flex; flex-direction: column; gap: 2px; }
.recent-card-title { font-size: 12.5px; font-weight: 800; }
.recent-card-meta { font-size: 10.5px; color: var(--text-dim); }
.games {
  max-width: 1200px; margin: 0 auto; padding: 0 20px 80px;
  position: relative; z-index: 1; flex: 1 1 auto;
}
.section-head {
  display: flex; justify-content: space-between;
  align-items: center; gap: 16px;
  margin-bottom: 22px; flex-wrap: wrap;
}
.section-head h2 { font-size: 22px; font-weight: 800; }
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-chip {
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text-dim); font-family: inherit;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all .16s;
}
.filter-chip:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
.filter-chip.on {
  color: #1a1500; background: var(--gold); border-color: var(--gold);
  box-shadow: 0 4px 14px rgba(245,197,24,.3);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}
.card {
  position: relative; border-radius: var(--radius-lg);
  overflow: hidden; background: var(--panel);
  border: 1px solid var(--border); cursor: pointer;
  display: flex; flex-direction: column;
  transition: transform .22s, border-color .22s, box-shadow .22s, opacity .3s;
}
.card:hover:not(.soon) {
  transform: translateY(-4px);
  border-color: var(--border-hover);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}
.card-cover { position: relative; aspect-ratio: 4/5; overflow: hidden; background: #000; }
.card-cover svg { width: 100%; height: 100%; display: block; }
.card-hover-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.75));
  display: grid; place-items: center;
  opacity: 0; transition: opacity .22s; pointer-events: none;
}
.card:hover .card-hover-overlay { opacity: 1; }
.card-play-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 24px; border-radius: 999px;
  background: var(--gold); color: #1a1500;
  font-weight: 800; font-size: 14px;
  transform: translateY(12px);
  transition: transform .22s;
  box-shadow: 0 8px 22px rgba(245,197,24,.4);
}
.card:hover .card-play-btn { transform: translateY(0); }
.soon-badge {
  position: absolute; top: 12px; right: 12px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(0,0,0,.78); border: 1px solid var(--border);
  color: var(--text-dim); font-size: 10px; font-weight: 700;
  backdrop-filter: blur(8px);
}
.card-body { padding: 12px 14px 14px; }
.card-title { font-size: 15px; font-weight: 800; margin-bottom: 3px; line-height: 1.3; }
.card-sub { font-size: 10.5px; color: var(--text-dim); letter-spacing: .06em; margin-bottom: 10px; }
.card-meta {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; font-size: 11px;
}
.card-meta .genre {
  padding: 2px 8px; border-radius: 5px;
  background: rgba(255,255,255,.06);
  color: var(--text-dim); font-weight: 600;
}
.card-meta .best { color: var(--gold); font-weight: 800; }
.card.soon { cursor: default; }
.card.soon .card-cover { filter: grayscale(.65) brightness(.65); }
.card.soon .card-title { color: var(--text-dim); }
.card.checking { opacity: .55; }
.card.new-found { animation: newPulse 1.5s ease-out; }
@keyframes newPulse {
  0% { box-shadow: 0 0 0 0 rgba(245,197,24,.8); }
  100% { box-shadow: 0 0 0 20px rgba(245,197,24,0); }
}
footer {
  padding: 22px 20px; border-top: 1px solid var(--border);
  text-align: center; color: var(--text-dim);
  font-size: 12px; line-height: 1.7;
  position: relative; z-index: 1;
}
footer a { color: var(--gold); text-decoration: none; font-weight: 700; }
footer a:hover { text-decoration: underline; }
/* ---- Toast ---- */
.hub-toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translate(-50%, 100px);
  padding: 12px 20px;
  background: linear-gradient(135deg, #1a1f2e, #0f1420);
  border: 1px solid rgba(245,197,24,.5);
  border-radius: 12px;
  color: #fff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 12px 30px rgba(0,0,0,.6), 0 0 20px rgba(245,197,24,.2);
  z-index: 1000;
  opacity: 0;
  transition: transform .35s cubic-bezier(.2, .9, .3, 1.2), opacity .3s;
  max-width: min(420px, 90vw);
}
.hub-toast.show { transform: translate(-50%, 0); opacity: 1; }
.hub-toast .ico { font-size: 18px; flex: 0 0 auto; }
@media (max-width: 600px) {
  header { padding: 12px 14px; gap: 8px; }
  .logo-text { font-size: 13px; letter-spacing: .18em; }
  .hero { padding: 36px 14px 28px; }
  .hero-stats { gap: 20px; padding: 14px 20px; }
  .stat b { font-size: 20px; }
  .recent { padding: 0 14px; }
  .games { padding: 0 14px 60px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 13.5px; }
  .card-sub { font-size: 9.5px; }
  .section-head h2 { font-size: 18px; }
}
</style>
</head>

<script>
(function(){
'use strict';

const faNum = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const getTop = id => { try { return parseInt(localStorage.getItem('arcade_top_'+id)||'0',10)||0; } catch(e){ return 0; } };
const getPlays = () => { try { return parseInt(localStorage.getItem('arcade_plays')||'0',10)||0; } catch(e){ return 0; } };
const getLast = () => LS.get('arcade_last',[]);

/* ============================================================
   آرایهٔ بازی‌ها
   available: true  = از قبل می‌دونیم فایل هست (fallback)
   available: false = اگه فایل پیدا شد، خودکار true می‌شه
   ============================================================ */
const GAMES = [
  { id:'river-raid',     title:'حمله رودخانه‌ای', sub:'RIVER RAID',     year:1982, genre:'شوتر عمودی', genreTag:'shooter', file:'river-raid.html',     available:true,  cover:'river' },
  { id:'space-invaders', title:'تهاجم فضایی',     sub:'SPACE INVADERS', year:1978, genre:'شوتر',       genreTag:'shooter', file:'space-invaders.html', available:true,  cover:'invaders' },
  { id:'breakout',       title:'دیوارشکن',        sub:'BREAKOUT',       year:1976, genre:'کلاسیک',     genreTag:'classic', file:'breakout.html',       available:false, cover:'breakout' },
  { id:'snake',          title:'مار',             sub:'SNAKE',          year:1997, genre:'کلاسیک',     genreTag:'classic', file:'snake.html',          available:false, cover:'snake' },
  { id:'asteroids',      title:'سیارک‌ها',        sub:'ASTEROIDS',      year:1979, genre:'شوتر',       genreTag:'shooter', file:'asteroids.html',      available:false, cover:'asteroids' },
  { id:'pong',           title:'پینگ‌پنگ',        sub:'PONG',           year:1972, genre:'کلاسیک',     genreTag:'classic', file:'pong.html',           available:false, cover:'pong' },
  { id:'tetris',         title:'تتریس',           sub:'TETRIS',         year:1984, genre:'پازل',       genreTag:'puzzle',  file:'tetris.html',         available:false, cover:'tetris' },
  { id:'pacman',         title:'پک‌من',           sub:'PAC-MAN',        year:1980, genre:'کلاسیک',     genreTag:'classic', file:'pacman.html',         available:false, cover:'pacman' }
];

/* ---- کاورها (SVG inline) ---- */
const COVERS = {
  river: () => `<svg viewBox="0 0 220 280" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="r1s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#051020"/><stop offset="1" stop-color="#0d2643"/></linearGradient><linearGradient id="r1w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d5c8f"/><stop offset="1" stop-color="#0d2c4c"/></linearGradient><linearGradient id="r1g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#347a3b"/><stop offset="1" stop-color="#173d1d"/></linearGradient></defs><rect width="220" height="280" fill="url(#r1s)"/><g fill="#cfe4ff" opacity=".65"><circle cx="30" cy="20" r="1.2"/><circle cx="90" cy="35" r="1"/><circle cx="160" cy="15" r="1.4"/><circle cx="190" cy="45" r="1"/><circle cx="60" cy="55" r=".8"/></g><path d="M0,60 L90,70 L70,130 L85,200 L60,280 L0,280 Z" fill="url(#r1g)"/><path d="M220,60 L130,70 L150,130 L135,200 L160,280 L220,280 Z" fill="url(#r1g)"/><path d="M90,70 L130,70 L150,130 L135,200 L160,280 L60,280 L85,200 L70,130 Z" fill="url(#r1w)"/><g stroke="#8fd2ff" stroke-width="1" opacity=".35" fill="none" stroke-linecap="round"><path d="M95,100 q8,-3 16,0 t16,0"/><path d="M90,145 q8,-3 16,0 t16,0 t16,0"/><path d="M85,220 q8,-3 16,0 t16,0 t16,0"/></g><g transform="translate(110,240)"><path d="M-3,10 L0,16 L3,10 Z" fill="#ff9a3c"/><path d="M0,-14 L4,-2 L14,6 L14,9 L4,7 L3,12 L-3,12 L-4,7 L-14,9 L-14,6 L-4,-2 Z" fill="#eef3f8" stroke="#9fb0c4" stroke-width="1"/><ellipse cx="0" cy="-3" rx="3" ry="5.5" fill="#2e6ea8"/></g></svg>`,

/* ============================================================
   تشخیص خودکار وجود فایل‌های بازی
   ============================================================ */
let filesChecked = false;
let checkPromise = null;
const newFoundGames = new Set(); // بازی‌هایی که تازه پیدا شدن (برای انیمیشن)

async function checkOneFile(game) {
  const url = game.file + (game.file.includes('?') ? '&' : '?') + '_t=' + Date.now();
  try {
    const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (res.status === 404) return false;
    if (res.ok) return true;
    // 403, 500, 405 و بقیه: نامشخص — پرچم دستی حفظ بشه
    return null;
  } catch (e) {
    // خطای شبکه یا CORS — نامشخص
    return null;
  }
}

async function checkGameFiles(opts) {
  opts = opts || {};
  const silent = !!opts.silent;

  // روی file:// امکان fetch نیست — از پرچم دستی استفاده کن
  if (location.protocol === 'file:') {
    filesChecked = true;
    return;
  }

  if (checkPromise && !opts.force) return checkPromise;

  const changed = [];

  const run = (async () => {
    if (!silent) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('checking'));
    }

    await Promise.all(GAMES.map(async (g) => {
      const prev = g.available;
      const exists = await checkOneFile(g);
      if (exists === true) {
        g.available = true;
      } else if (exists === false) {
        g.available = false;
      }
      // exists === null: پرچم دستی حفظ بشه
      if (!prev && g.available) {
        changed.push(g);
        newFoundGames.add(g.id);
      }
    }));

    filesChecked = true;

    // Re-render
    const activeFilter = (document.querySelector('.filter-chip.on') || {}).dataset?.filter || 'all';
    renderAll(activeFilter);

    // Toast برای بازی‌های جدید
    if (changed.length > 0 && !silent) {
      if (changed.length === 1) {
        showToast(`بازی جدید پیدا شد: ${changed[0].title}`, '✨');
      } else {
        showToast(`${changed.length} بازی جدید پیدا شد!`, '🎮');
      }
      // پاک کردن انیمیشن جدید بعد از مدتی
      setTimeout(() => {
        changed.forEach(g => newFoundGames.delete(g.id));
      }, 3000);
    }

    // پاک کردن حالت loading
    document.querySelectorAll('.card.checking').forEach(c => c.classList.remove('checking'));

    // پاک کردن انیمیشن new-found بعد از مدتی
    setTimeout(() => {
      document.querySelectorAll('.card.new-found').forEach(c => c.classList.remove('new-found'));
    }, 2000);
  })();

  checkPromise = run;
  try { await run; } finally { checkPromise = null; }
}

/* ============================================================
   Toast
   ============================================================ */
function showToast(text, icon) {
  const el = document.createElement('div');
  el.className = 'hub-toast';
  el.innerHTML = `<span class="ico">${icon || '✨'}</span><span>${text}</span>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  }, 3500);
}

/* ============================================================
   ساخت کارت
   ============================================================ */
function cardHTML(g){
  const best = getTop(g.id);
  const dis = !g.available;
  const isNew = newFoundGames.has(g.id);
  return `<div class="card ${dis?'soon':''} ${isNew?'new-found':''}" data-id="${g.id}">
    <div class="card-cover">
      ${COVERS[g.cover]?COVERS[g.cover]():''}
      ${dis?'<span class="soon-badge">به زودی</span>':''}
      ${!dis?`<div class="card-hover-overlay"><div class="card-play-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>بازی کن</div></div>`:''}
    </div>
    <div class="card-body">
      <div class="card-title">${g.title}</div>
      <div class="card-sub">${g.sub} · ${g.year}</div>
      <div class="card-meta">
        <span class="genre">${g.genre}</span>
        <span class="best">${best>0?faNum(best):'—'}</span>
      </div>
    </div>
  </div>`;
}

function renderGrid(filter){
  filter = filter || 'all';
  const grid = document.getElementById('grid');
  const gs = filter==='all' ? GAMES : GAMES.filter(g => g.genreTag===filter);
  grid.innerHTML = gs.map(cardHTML).join('');
  grid.querySelectorAll('.card:not(.soon)').forEach(c => {
    c.addEventListener('click', () => {
      const g = GAMES.find(x => x.id === c.dataset.id);
      if (g) launch(g);
    });
  });
}

function renderRecent(){
  const section = document.getElementById('recentSection');
  const list = document.getElementById('recentList');
  const games = getLast().map(id => GAMES.find(g => g.id===id)).filter(g => g && g.available);
  if (!games.length) { section.hidden = true; return; }
  section.hidden = false;
  list.innerHTML = games.map(g => {
    const top = getTop(g.id);
    return `<div class="recent-card" data-id="${g.id}">
      <div class="recent-card-cover">${COVERS[g.cover]?COVERS[g.cover]():''}</div>
      <div class="recent-card-body">
        <div class="recent-card-title">${g.title}</div>
        <div class="recent-card-meta">بهترین: ${top>0?faNum(top):'—'}</div>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.recent-card').forEach(c => {
    c.addEventListener('click', () => {
      const g = GAMES.find(x => x.id === c.dataset.id);
      if (g) launch(g);
    });
  });
}

function updateStats(){
  document.getElementById('statGames').textContent = faNum(GAMES.filter(g=>g.available).length);
  document.getElementById('statPlays').textContent = faNum(getPlays());
  let best = 0;
  GAMES.forEach(g => { const t = getTop(g.id); if (t>best) best=t; });
  document.getElementById('statBest').textContent = faNum(best);
}

function renderAll(filter) {
  updateStats();
  renderRecent();
  renderGrid(filter);
}

function launch(g){
  if (!g.available) return;
  const last = getLast().filter(x => x!==g.id);
  last.unshift(g.id);
  LS.set('arcade_last', last.slice(0,6));
  LS.set('arcade_plays', getPlays()+1);
  location.href = g.file;
}

/* ============================================================
   فیلترها
   ============================================================ */
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.filter-chip');
  if (!b) return;
  document.querySelectorAll('.filter-chip').forEach(x => x.classList.toggle('on', x===b));
  renderGrid(b.dataset.filter);
});

/* ============================================================
   دکمهٔ چک دستی
   ============================================================ */
document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await checkGameFiles({ force: true });
  btn.classList.remove('spinning');
});

/* ============================================================
   چک خودکار هنگام برگشت به تب (با throttle)
   ============================================================ */
let lastAutoCheck = 0;
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && filesChecked && Date.now() - lastAutoCheck > 45000) {
    lastAutoCheck = Date.now();
    checkGameFiles({ silent: true });
  }
});

/* ============================================================
   PWA install
   ============================================================ */
let deferred = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  document.getElementById('installBtn').hidden = false;
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferred) return;
  deferred.prompt();
  const r = await deferred.userChoice;
  if (r.outcome==='accepted') document.getElementById('installBtn').hidden = true;
  deferred = null;
});

/* ============================================================
   شروع
   ============================================================ */
// ۱) رندر اولیه با پرچم‌های دستی (بدون تأخیر، کاربر فوراً محتوا رو می‌بینه)
renderAll('all');

// ۲) چک خودکار فایل‌ها در پس‌زمینه
checkGameFiles({ silent: false });

})();
</script>
